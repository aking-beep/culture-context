[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="culture-context-ingestion"
version="0.1.0"
requires-python=">=3.11"
dependencies=["httpx>=0.27,<1","pydantic>=2.8,<3"]

[project.optional-dependencies]
dev=["pytest>=8,<10"]

[tool.setuptools.packages.find]
where=["."]
include=["culture_ingestion*"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
