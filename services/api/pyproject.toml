[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-context"
version = "0.1.0"
description = "Provenance-first travel context and source normalization service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["culture_context*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
