services:
  api:
    build: ../services/api
    ports: ["8580:8580"]
    environment:
      CULTURE_API_HOST: 0.0.0.0
      CULTURE_API_PORT: 8580
      CULTURE_SNAPSHOT_DIR: /data/snapshots
      CULTURE_CHANGE_DIR: /data/changes
      CULTURE_EXPLAIN_ENABLED: "false"
      CULTURE_DISRUPTIONS_ENABLED: "true"
    volumes:
      - ../data/snapshots:/data/snapshots
      - ../data/changes:/data/changes
